name: Build & deploy

on:
  push:
    branches:
      - 'stage'

  workflow_dispatch:
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      VITE_ROLLUP_A_CHAIN_ID: "77777"
      VITE_ROLLUP_B_CHAIN_ID: "88888"
      VITE_HOODI_CHAIN_ID: "560048"
      VITE_ROLLUP_A_RPC_HTTP: '["https://rollup-rpc-1.stage.ops.ssvlabsinternal.com"]'
      VITE_ROLLUP_B_RPC_HTTP: '["https://rollup-rpc-2.stage.ops.ssvlabsinternal.com"]'
      VITE_HOODI_RPC_HTTP: '["https://ethereum-hoodi-rpc.publicnode.com/d8a2cc6e7483872e917d7899f9403d738b001c80e37d66834f4e40e9efb54a27"]'
      VITE_MAINNET_RPC_HTTP: '["https://eth.llamarpc.com"]'
      VITE_POLYGON_RPC_HTTP: '["https://polygon-rpc.com"]'
      VITE_ROLLUP_A_BLOCK_EXPLORER_URL: "https://blockscout-rollup-1.stage.ops.ssvlabsinternal.com/"
      VITE_ROLLUP_B_BLOCK_EXPLORER_URL: "https://blockscout-rollup-2.stage.ops.ssvlabsinternal.com/"
      VITE_HOODI_BRIDGE_ADDRESS: "0x9adb5dba4f55d7ea921f34e98dc492b3a2ced734"
      VITE_BRIDGE_HOODI_TO_ROLLUP_A: "0xe6456c49bae7ff20bee0d01948d6d0f82dd821e9"
      VITE_BRIDGE_HOODI_TO_ROLLUP_B: "0x9adb5dba4f55d7ea921f34e98dc492b3a2ced734"
      VITE_ROLLUP_A_KERNEL_IMPL: "0x1ff48513f8722113ab840fdfd1866957d08bd5d2"
      VITE_ROLLUP_A_KERNEL_FACTORY: "0xcfb519af7e3e4b772c619ed12bcdc7d758ac6ee6"
      VITE_ROLLUP_A_MULTICHAIN_VALIDATOR: "0x5e729b0d9d35fa3bd7ace526437151ec9e1d5929"
      VITE_ROLLUP_A_META_FACTORY: "0x54db674c515e5fdec3f91345bc2fdafafd8b3b8a"
      VITE_ROLLUP_B_KERNEL_IMPL: "0x1ff48513f8722113ab840fdfd1866957d08bd5d2"
      VITE_ROLLUP_B_KERNEL_FACTORY: "0xcfb519af7e3e4b772c619ed12bcdc7d758ac6ee6"
      VITE_ROLLUP_B_MULTICHAIN_VALIDATOR: "0x5e729b0d9d35fa3bd7ace526437151ec9e1d5929"
      VITE_ROLLUP_B_META_FACTORY: "0x54db674c515e5fdec3f91345bc2fdafafd8b3b8a"
      VITE_ROLLUP_A_BRIDGE_ADDRESS: "0x31c57E2910496e46Bb883EDeb1eB2bee8E3Ee82C"
      VITE_ROLLUP_B_BRIDGE_ADDRESS: "0x31c57E2910496e46Bb883EDeb1eB2bee8E3Ee82C"
      VITE_BRIDGE_TOKEN_ADDRESS: "0x4c77De11C15d8b5e2584e67e2E6E1Ec7A78B0b5b"
      VITE_WETH_ADDRESS: "0x356dA0CBA100a69B3FD3F2Ce4871B7e3921E7553"
      VITE_USDC_ADDRESS: "0xeA0DB94b4c702d9cA0Fcc65715A035B24dF3452D"
      VITE_SSV_ADDRESS: "0x79155fb8d8dE01522bE1Cbd17e538966d78d1565"
      VITE_ROLLUP_B_SWAP_ADDRESS: "0x70f2e907bf467E28A96A2e314B5200c2B144b76c"
      VITE_PAYMASTER_URL: "https://paymaster.stage.ops.ssvlabsinternal.com"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install packages
        run: pnpm install

      - name: Setup swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 4

      - name: Run stage webapp build
        env:
          NODE_OPTIONS: --max-old-space-size=2048
        run:
          pnpm -r --workspace-concurrency=1 build

      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/stage'
        uses: aws-actions/configure-aws-credentials@50ac8dd1e1b10d09dac7b8727528b91bed831ac0 # v3
        with:
          role-to-assume: ${{ secrets.COMPOSE_WEB_DEMO_STAGE_AWS_IAM_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload files to S3
        if: github.ref == 'refs/heads/stage'
        run: |
          aws s3 cp ./build s3://${{ secrets.COMPOSE_WEB_DEMO_STAGE_AWS_S3_BUCKET }} --recursive
